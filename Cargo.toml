[package]
name = "logmachine"
version = "2.6.1"
edition = "2026"
description = "Collaborative, beautiful logging system for distributed developers"
license = "MIT"
repository = "https://github.com/logmachine/rust"
readme = "README.md"
keywords = ["logger", "logging", "debug", "collaborative","logmachine"]
categories = ["development-tools"]

[lib]
path = "main.rs"

[dependencies]
chrono = "0.4.38"
log = { version = "0.4.22", features = ["std"] }
once_cell = "1.20.2"
regex = "1.10.6"
reqwest = { version = "0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
open = "5"

[features]
default = []
socketio = ["rust_socketio"]

[dependencies.rust_socketio]
version = "0.6"
optional = true
