[package]
name = "logmachine"
version = "0.1.0"
edition = "2021"

[lib]
path = "main.rs"

[dependencies]
chrono = "0.4.38"
log = { version = "0.4.22", features = ["std"] }
once_cell = "1.20.2"
regex = "1.10.6"
reqwest = { version = "0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
